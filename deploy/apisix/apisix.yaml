# Generated by hand for the MVP (5 services — not worth tools/render's
# ~560 lines yet, see the plan's "Render tool'u almama kararı"). Written in
# the SHAPE render would produce so a later component-count jump can adopt
# it without a rewrite: one route block per service, CORS repeated per
# route (standalone APISIX has no shared `services` object to hang it on),
# request-id + rate limit on everything, an explicit internal-deny route so
# "içeri kapalı" is enforced, not just assumed.

x-cors: &cors
  cors:
    allow_origins: "*"
    allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
    allow_headers: "Authorization,Content-Type,Idempotency-Key,X-Anchor-Token,X-Request-Id"
    expose_headers: "X-Request-Id"
    max_age: 3600

x-ratelimit: &ratelimit
  rate: 20
  burst: 10
  key: remote_addr
  rejected_code: 429

# Strips any client-supplied X-Internal-Api-Key before it reaches an
# upstream service — makes true the assumption pkg/authx/authx.go's
# RequireInternalKey doc comment states ("the gateway strips this header
# from any request that did not originate inside the cluster"). Defense in
# depth: /internal/* itself is already blocked by the internal-deny route
# below regardless of this header (SERVICE.md #16).
x-strip-internal: &strip_internal
  proxy-rewrite:
    headers:
      remove:
        - "X-Internal-Api-Key"

routes:
  - id: internal-deny
    uris:
      - /internal/*
    priority: 100
    plugins:
      fault-injection:
        abort:
          http_status: 403
          body: "forbidden: internal routes are not reachable from outside the cluster\n"

  - id: auth
    uris:
      - /auth/*
    plugins:
      <<: [*cors, *strip_internal]
      request-id: {}
      limit-req: *ratelimit
    upstream:
      type: roundrobin
      nodes:
        pay-auth-service:8081: 1
      timeout:
        connect: 5
        send: 15
        read: 15

  - id: cheque
    uris:
      # /cheques (no trailing segment) is POST /cheques itself
      # (CreateCheque) — APISIX's radix-tree router treats /cheques/*
      # as "one or more sub-segments", so it never matches the bare path
      # on its own; without this line the edge 404s a call the service
      # itself answers correctly (SERVICE.md #19a).
      - /cheques
      - /cheques/*
      - /sync
      - /pool/*
    plugins:
      <<: [*cors, *strip_internal]
      request-id: {}
      limit-req: *ratelimit
    upstream:
      type: roundrobin
      nodes:
        pay-cheque-service:8083: 1
      timeout:
        connect: 5
        send: 15
        read: 15

  - id: tx
    uris:
      - /tx/*
    plugins:
      <<: [*cors, *strip_internal]
      request-id: {}
      limit-req: *ratelimit
    upstream:
      type: roundrobin
      nodes:
        pay-tx-service:8084: 1
      timeout:
        connect: 5
        send: 15
        read: 15

  - id: anchor
    uris:
      # /anchors (no trailing segment) is GET /anchors itself (List) — same
      # radix-tree gap as the cheque route above (SERVICE.md #19a).
      - /anchors
      - /anchors/*
    plugins:
      <<: [*cors, *strip_internal]
      request-id: {}
      limit-req: *ratelimit
    upstream:
      type: roundrobin
      nodes:
        pay-anchor-service:8086: 1
      timeout:
        # SEP-24 interactive starts and anchor toml fetches can be slow —
        # longer read timeout than the other routes.
        connect: 5
        send: 30
        read: 30

#END
